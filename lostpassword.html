<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> LifeSync-Esqueci Minha Senha</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="entrar" role="main">
      <p class="subtitulo">Digite seu e‑mail e enviaremos instruções para redefinir sua senha.</p>

      <form action="lostpasswordsucess.html" method="get" class="form-esqueci">
        <div class="campo">
          <label for="email">E-mail</label>
          <input required placeholder="Digite seu e‑mail">
        </div>

        <div class="actions">
          <button type="submit" class="açao açao2">Enviar</button>
          <a href="login.html" class="açao açao3">Voltar</a>
        </div>
      </form>
      <p class="novaconta">Não recebeu o e‑mail? Verifique a caixa de spam ou tente novamente em alguns minutos.</p>
    </main>
  </body>
